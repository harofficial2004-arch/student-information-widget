<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #ffffff;
      color: #344054;
    }

    .widget {
      width: 100%;
      background: #ffffff;
      border: 1px solid #e4e7ec;
      border-radius: 6px;
      overflow: hidden;
    }

    .header {
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      border-bottom: 1px solid #e4e7ec;
    }

    .header-title {
      font-size: 15px;
      font-weight: 600;
      color: #101828;
    }

    .arrow {
      font-size: 18px;
      color: #667085;
    }

    .content {
      padding: 16px;
    }

    .field {
      margin-bottom: 18px;
    }

    .field:last-child {
      margin-bottom: 2px;
    }

    .label {
      font-size: 12px;
      color: #667085;
      margin-bottom: 5px;
    }

    .value {
      font-size: 14px;
      font-weight: 500;
      color: #344054;
      line-height: 1.35;
    }
  </style>
</head>

<body>

  <div class="widget">

    <div class="header">
      <div class="header-title">Student Information</div>
      <div class="arrow">⌃</div>
    </div>

    <div class="content">

      <div class="field">
        <div class="label">Program of Interest</div>
        <div class="value">Acting &amp; Communications</div>
      </div>

      <div class="field">
        <div class="label">Semester</div>
        <div class="value">Semester 2</div>
      </div>

      <div class="field">
        <div class="label">Housing Status</div>
        <div class="value">On-Campus Resident</div>
      </div>

      <div class="field">
        <div class="label">Residence Name</div>
        <div class="value">Howard Brodie</div>
      </div>

    </div>

  </div>

</body>
</html>
